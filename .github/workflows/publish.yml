name: Publish
on:
  schedule:
    - cron: '33 3 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@27.12.0
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout Scryer Prolog
        run: git clone https://codeberg.org/mthom/scryer-prolog
      - name: Compile Scryer Prolog
        run: cargo build --release
        working-directory: scryer-prolog
      - name: Install Scryer Prolog
        run: sudo cp scryer-prolog/target/release/scryer-prolog /usr/bin/scryer-prolog
      - name: Install Dependencies
        run: make setup
      - name: Generate docs for https://www.scryer.pl
        run: make
      - name: Upload site
        run: netlify deploy --site $NETLIFY_SITE_ID --prod --dir=output
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
